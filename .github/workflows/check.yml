name: Check skill tools
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/taskkit.py validate examples/demo/task.json
      - run: python3 scripts/taskkit.py cost examples/budget.json
      - run: python3 scripts/taskkit.py cost examples/budget-subscription.json
